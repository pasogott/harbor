services:
  chandra:
    container_name: ${HARBOR_CONTAINER_PREFIX}.chandra
    image: ${HARBOR_CHANDRA_IMAGE}:${HARBOR_CHANDRA_VERSION}
    env_file:
      - ./.env
      - ./services/chandra/override.env
    # vLLM needs a large /dev/shm for its tensor-parallel and multimodal paths
    ipc: host
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HARBOR_HF_TOKEN}
    # Flags mirror upstream's chandra_vllm launcher; the mm-processor pixel
    # bounds are what the OCR model was tuned for and are not vLLM defaults.
    command: >
      --model ${HARBOR_CHANDRA_MODEL}
      --served-model-name chandra
      --dtype bfloat16
      --max-model-len 18000
      --gpu-memory-utilization 0.85
      --enable-prefix-caching
      --mm-processor-kwargs '{"min_pixels":3136,"max_pixels":6291456}'
      ${HARBOR_CHANDRA_EXTRA_ARGS}
    volumes:
      # Standard HF hub layout, shared with vLLM/TEI/llama.cpp
      - ${HARBOR_HF_CACHE:-./services/chandra/.hf-cache}:/root/.cache/huggingface
    ports:
      - ${HARBOR_CHANDRA_HOST_PORT}:8000
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      # First start downloads ~10GB of weights; allow a long grace period
      start_period: 30m
    networks:
      - harbor-network
